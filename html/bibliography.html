	<body>
		<a href="#main" class="skip-link">Skip to main content</a>
		<div data-include="nav"></div>

		<h1 id="title">Disclosing Generative AI Use in Digital Humanities Research</h1>

		<main aria-labelledby="title" id="main">
			<h2 id="bibliography">Bibliography</h2>

			<section aria-labelledby="bibliography-content">
				<h3 id="bibliography-content">Bibliography</h3>
				<p>Content coming soon.</p>
			</section>
		</main>

		<div data-include="footer"></div>

		<script>
			// Includes HTML snippets; vanilla JavaScript implementation
			document.addEventListener('DOMContentLoaded', function() {
				var includes = document.querySelectorAll('[data-include]');
				var basePath = '../';
				includes.forEach(function(element) {
					var file = basePath + 'common/' + element.getAttribute('data-include') + '.html?vers=008';
					fetch(file)
						.then(response => response.text())
						.then(function(data) {
							element.innerHTML = data;
							element.querySelectorAll('a[href]').forEach(function(a) {
								var href = a.getAttribute('href');
								if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:')) {
									a.setAttribute('href', basePath + href);
								}
							});
								if (element.getAttribute('data-include') === 'nav') {
									var btn = element.querySelector('.hamburger');
									var menu = element.querySelector('.nav-menu');
									var overlay = document.createElement('div');
									overlay.className = 'nav-overlay';
									var closeBtn = document.createElement('button');
									closeBtn.className = 'nav-menu-close';
									closeBtn.setAttribute('aria-label', 'Close menu');
									closeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
									var mobileMenu = menu.cloneNode(true);
									mobileMenu.classList.add('nav-menu-mobile');
									mobileMenu.insertBefore(closeBtn, mobileMenu.firstChild);
									document.body.appendChild(overlay);
									document.body.appendChild(mobileMenu);
									if (btn && mobileMenu) {
										function toggleMenu() {
											var open = mobileMenu.classList.toggle('open');
											overlay.classList.toggle('open', open);
											btn.setAttribute('aria-expanded', open);
										}
										btn.addEventListener('click', toggleMenu);
										overlay.addEventListener('click', toggleMenu);
										closeBtn.addEventListener('click', toggleMenu);
										mobileMenu.querySelectorAll('a').forEach(function(a) {
											a.addEventListener('click', function() {
												if (mobileMenu.classList.contains('open')) toggleMenu();
											});
										});
									}
								}
						})
						.catch(error => console.error('Error loading include:', error));
				});
			// Add scroll detection for nav border
			var navElement = document.querySelector('[data-include="nav"]');
			window.addEventListener('scroll', function() {
				if (window.scrollY > 100) {
					navElement.classList.add('scrolled');
				} else {
					navElement.classList.remove('scrolled');
				}
			});

			});
		</script>
	</body>
</html>
